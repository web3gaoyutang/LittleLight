openapi: 3.0.3
info:
  title: LittleLight Teacher API
  version: 0.1.0
  description: 微光老师工程 API 契约，覆盖当前 MVP 的工作台、课表、待办、家校沟通、疗愈和 AI 能力。
servers:
  - url: http://localhost:8080
    description: local API
  - url: http://localhost:8081
    description: docker web gateway
security:
  - SessionToken: []
  - DevUser: []
tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Billing
  - name: Notifications
  - name: Sync
  - name: Dashboard
  - name: Courses
  - name: Reminders
  - name: Parents
  - name: CommunicationRecords
  - name: AI
  - name: Healing
paths:
  /healthz:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        "200":
          description: Service health state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [Health]
      security: []
      summary: Readiness check
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/auth/wechat:
    post:
      tags: [Auth]
      security: []
      summary: WeChat App login
      description: 使用 App 微信授权 code 换取 openid，按 openid 查找或创建用户，并返回服务端 session token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginInput"
      responses:
        "200":
          description: WeChat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: WeChat credentials are not configured
  /api/v1/auth/wechat/mock:
    post:
      tags: [Auth]
      security: []
      summary: Mock WeChat login for development
      description: 开发阶段微信模拟登录；仅在 AUTH_ALLOW_MOCK_LOGIN=true 时可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginInput"
      responses:
        "200":
          description: Mock WeChat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      description: 撤销当前 Bearer session；前端退出登录时调用，随后清理本地登录态。
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/me:
    get:
      tags: [Me]
      summary: Get current teacher profile
      responses:
        "200":
          description: Current teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      tags: [Me]
      summary: Update current teacher profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Updated teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    delete:
      tags: [Me]
      summary: Delete current account and owned data
      description: Deletes the current user account, server sessions, and all account-owned courses, reminders, parent profiles, communication records, healing entries, AI generation records, AI action audit rows, and favorites. A later WeChat login for the same openid creates a new account.
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/me/export:
    get:
      tags: [Me]
      summary: Export current account data
      description: Returns current account-owned profile, courses, reminders, parent profiles, communication records, healing entries, AI generation records with action audit rows, favorites, and export timestamp.
      responses:
        "200":
          description: Account export JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
  /api/v1/me/favorites:
    get:
      tags: [Me]
      summary: List favorites
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [communication_template, ai_praise, class_feedback]
          description: Filter by favorite type.
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Favorite list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteList"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Me]
      summary: Create a favorite item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "200":
          description: Created favorite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"
  /api/v1/me/favorites/{id}:
    delete:
      tags: [Me]
      summary: Delete a favorite item
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/billing/entitlements:
    get:
      tags: [Billing]
      summary: Get current billing entitlements
      responses:
        "200":
          description: Current entitlement boundary status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      summary: Request a simulated billing checkout
      description: Simulates WeChat Pay for Pro membership during MVP; no real charge is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
      responses:
        "200":
          description: Simulated checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResult"
  /api/v1/notifications/settings:
    get:
      tags: [Notifications]
      summary: Get reminder notification settings
      responses:
        "200":
          description: Notification boundary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    put:
      tags: [Notifications]
      summary: Update reminder notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsInput"
      responses:
        "200":
          description: Updated notification boundary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
  /api/v1/sync/status:
    get:
      tags: [Sync]
      summary: Get cloud sync and object storage status
      responses:
        "200":
          description: Sync boundary status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Get today's dashboard summary
      parameters:
        - $ref: "#/components/parameters/Day"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/courses:
    get:
      tags: [Courses]
      summary: List courses by weekday
      parameters:
        - name: weekday
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 is Sunday, 6 is Saturday.
      responses:
        "200":
          description: Course list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Courses]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /api/v1/courses/imports/template:
    get:
      tags: [Courses]
      summary: Download course import CSV template
      responses:
        "200":
          description: Course import CSV template
          content:
            text/csv:
              schema:
                type: string
  /api/v1/courses/imports:
    post:
      tags: [Courses]
      summary: Import courses from .xlsx or .csv
      parameters:
        - name: preview
          in: query
          schema:
            type: boolean
          description: Parse and validate rows without persisting them.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Course import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /api/v1/courses/{id}:
    get:
      tags: [Courses]
      summary: Get a course
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Courses]
      summary: Update a course
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      tags: [Courses]
      summary: Delete a course
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/reminders:
    get:
      tags: [Reminders]
      summary: List reminders by day
      parameters:
        - $ref: "#/components/parameters/Day"
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Reminders]
      summary: Create a reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "200":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /api/v1/reminders/{id}:
    get:
      tags: [Reminders]
      summary: Get a reminder
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Reminder detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
    put:
      tags: [Reminders]
      summary: Update a reminder
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
    delete:
      tags: [Reminders]
      summary: Soft-delete a reminder
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/reminders/{id}/complete:
    post:
      tags: [Reminders]
      summary: Mark a reminder as done
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/reminders/{id}/snooze:
    post:
      tags: [Reminders]
      summary: Snooze a reminder
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [until]
              properties:
                until:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Snoozed reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /api/v1/parents:
    get:
      tags: [Parents]
      summary: List parent profiles
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Parent profile list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentProfileList"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Parents]
      summary: Create a parent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentProfileInput"
      responses:
        "200":
          description: Created parent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentProfile"
  /api/v1/parents/imports/template:
    get:
      tags: [Parents]
      summary: Download parent profile import CSV template
      responses:
        "200":
          description: Parent profile import CSV template
          content:
            text/csv:
              schema:
                type: string
  /api/v1/parents/imports:
    post:
      tags: [Parents]
      summary: Import parent profiles from .xlsx or .csv
      parameters:
        - name: preview
          in: query
          schema:
            type: boolean
          description: Parse and validate rows without persisting them.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parent profile import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /api/v1/parents/{id}:
    get:
      tags: [Parents]
      summary: Get a parent profile
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Parent profile detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentProfile"
    put:
      tags: [Parents]
      summary: Update a parent profile
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentProfileInput"
      responses:
        "200":
          description: Updated parent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentProfile"
    delete:
      tags: [Parents]
      summary: Delete a parent profile
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/communication-records:
    get:
      tags: [CommunicationRecords]
      summary: List communication records
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Communication record list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationRecordList"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [CommunicationRecords]
      summary: Create a communication record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunicationRecordInput"
      responses:
        "200":
          description: Created communication record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationRecord"
  /api/v1/communication-records/{id}:
    get:
      tags: [CommunicationRecords]
      summary: Get a communication record
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Communication record detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationRecord"
    put:
      tags: [CommunicationRecords]
      summary: Update a communication record
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunicationRecordInput"
      responses:
        "200":
          description: Updated communication record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationRecord"
    delete:
      tags: [CommunicationRecords]
      summary: Delete a communication record
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
  /api/v1/communication-records/{id}/complete-follow-up:
    post:
      tags: [CommunicationRecords]
      summary: Mark a communication follow-up as done
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated communication record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationRecord"
  /api/v1/ai/parent-drafts:
    post:
      tags: [AI]
      summary: Generate parent communication drafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentDraftRequest"
      responses:
        "200":
          description: Draft list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIDraft"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/ai/praise:
    post:
      tags: [AI]
      summary: Generate an AI praise sentence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PraiseRequest"
      responses:
        "200":
          description: Praise draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIDraft"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/ai/generations:
    get:
      tags: [AI]
      summary: List AI generation audit records
      parameters:
        - name: scenario
          in: query
          schema:
            type: string
            enum: [parent_drafts, praise]
          description: Filter by AI generation scenario.
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: AI generation audit record list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGenerationList"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/ai/generations/{id}:
    get:
      tags: [AI]
      summary: Get an AI generation audit record
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: AI generation audit record detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGeneration"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [AI]
      summary: Delete an AI generation audit record
      description: Removes the current user's AI input, output, and related action audit records for the generation.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/generations/{id}/actions:
    post:
      tags: [AI]
      summary: Record a teacher action on an AI generation
      description: For outputs marked as requiring review, copy/save actions require a prior review_confirmed action for the same draft or generation.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIActionInput"
      responses:
        "200":
          description: Created AI action audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/healing/entries:
    get:
      tags: [Healing]
      summary: List healing entries
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [breath, praise, treehole, sound]
          description: Filter by healing entry type.
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Healing entry list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealingEntryList"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Healing]
      summary: Save a healing entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealingEntryInput"
      responses:
        "200":
          description: Created healing entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealingEntry"
  /api/v1/healing/entries/{id}:
    get:
      tags: [Healing]
      summary: Get a healing entry
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Healing entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealingEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Healing]
      summary: Delete a healing entry
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: LittleLightSession
      description: "微信登录或开发模拟登录返回的 sessionToken，前端以 Authorization: Bearer <token> 携带。"
    DevUser:
      type: apiKey
      in: header
      name: X-User-ID
      description: 仅开发阶段鉴权；需要显式开启 AUTH_ALLOW_DEV_USER=true，且值非空并对应已存在用户。生产部署应关闭 AUTH_ALLOW_DEV_USER。
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Day:
      name: day
      in: query
      schema:
        type: string
        format: date
      example: "2026-05-27"
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
      description: Keyword search over the main text fields.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Maximum number of items to return.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of matching items to skip.
  responses:
    OK:
      description: Boolean operation result
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests in a short time window. Response includes Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ID:
      type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        dependencies:
          type: object
          additionalProperties:
            type: string
          example:
            postgres: ok
            redis: ok
        time:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
    WechatLoginInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 512
          description: App 微信授权 code；mock 端点中会用于生成稳定模拟 openid。
        nickName:
          type: string
          maxLength: 80
          description: 微信昵称或用户手动输入昵称。
        avatarUrl:
          type: string
          maxLength: 500
          description: 微信头像 URL。
    WechatSession:
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/ID"
        sessionToken:
          type: string
        openId:
          type: string
        profile:
          $ref: "#/components/schemas/UserProfile"
        expiresAt:
          type: string
          format: date-time
    UserProfile:
      allOf:
        - $ref: "#/components/schemas/UserProfileInput"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ID"
            createdAt:
              type: string
              format: date-time
    UserProfileInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        school:
          type: string
        stage:
          type: string
        subject:
          type: string
        isHeadTeacher:
          type: boolean
        proStatus:
          type: string
          enum: [free, trial, pro, expired]
        reminderPolicy:
          type: string
          enum: [normal, low_interrupt]
    Entitlements:
      type: object
      properties:
        plan:
          type: string
          enum: [free, pro]
        status:
          type: string
          enum: [free, trial, pro, expired]
        features:
          type: array
          items:
            type: string
        checkoutStatus:
          type: string
          enum: [not_configured, unavailable, ready]
        checkoutMessage:
          type: string
    BillingCheckoutRequest:
      type: object
      required: [plan, provider, mock]
      properties:
        plan:
          type: string
          enum: [monthly, yearly]
        provider:
          type: string
          enum: [wechat]
        mock:
          type: boolean
          description: Must be true until real WeChat Pay is configured.
    BillingCheckoutResult:
      type: object
      properties:
        orderId:
          type: string
        plan:
          type: string
          enum: [monthly, yearly]
        provider:
          type: string
          enum: [wechat]
        amountCents:
          type: integer
        currency:
          type: string
          example: CNY
        status:
          type: string
          enum: [paid]
        message:
          type: string
        profile:
          $ref: "#/components/schemas/UserProfile"
        entitlements:
          $ref: "#/components/schemas/Entitlements"
    NotificationSettings:
      allOf:
        - $ref: "#/components/schemas/NotificationSettingsInput"
        - type: object
          properties:
            providerStatus:
              type: string
              enum: [not_configured, ready]
            permissionRequired:
              type: boolean
            message:
              type: string
    NotificationSettingsInput:
      type: object
      additionalProperties: false
      properties:
        reminderPolicy:
          type: string
          enum: [normal, low_interrupt]
    SyncStatus:
      type: object
      properties:
        cloudSyncStatus:
          type: string
          enum: [local_persistence, not_configured, ready]
        objectStorageStatus:
          type: string
          enum: [not_configured, ready]
        lastSyncedAt:
          type: string
          format: date-time
        message:
          type: string
    AccountExport:
      type: object
      required: [profile, courses, reminders, parents, communicationRecords, healingEntries, aiGenerations, favorites, exportedAt]
      properties:
        profile:
          $ref: "#/components/schemas/UserProfile"
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ParentProfile"
        communicationRecords:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationRecord"
        healingEntries:
          type: array
          items:
            $ref: "#/components/schemas/HealingEntry"
        aiGenerations:
          type: array
          items:
            $ref: "#/components/schemas/AIGeneration"
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/Favorite"
        exportedAt:
          type: string
          format: date-time
    Favorite:
      allOf:
        - $ref: "#/components/schemas/FavoriteInput"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ID"
            createdAt:
              type: string
              format: date-time
    FavoriteList:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Favorite"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    FavoriteInput:
      type: object
      additionalProperties: false
      required: [type, title, content]
      properties:
        type:
          type: string
          enum: [communication_template, ai_praise, class_feedback]
        title:
          type: string
        content:
          type: string
        sourceId:
          type: string
          nullable: true
    ImportResult:
      type: object
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
        preview:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreview"
        failureCsv:
          type: string
          description: CSV content containing failed rows and failure reasons.
    ImportPreview:
      type: object
      properties:
        row:
          type: integer
        status:
          type: string
          enum: [ready, invalid, duplicate]
        message:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
    PageInfo:
      type: object
      required: [limit, offset, count, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 0
        nextOffset:
          type: integer
          minimum: 0
          description: Present when hasMore is true.
        hasMore:
          type: boolean
    Course:
      allOf:
        - $ref: "#/components/schemas/CourseInput"
        - type: object
          properties:
            id:
