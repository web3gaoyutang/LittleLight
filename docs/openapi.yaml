          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        safetyLabel:
          type: string
        tokenUsage:
          type: integer
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AIAction"
        createdAt:
          type: string
          format: date-time
    AIGenerationList:
