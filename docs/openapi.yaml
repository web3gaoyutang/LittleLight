        category:
          type: string
        remindAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, done, snoozed, deleted]
        note:
          type: string
        parentId:
          type: string
          nullable: true
        courseId:
          type: string
          nullable: true
    ParentProfile:
      allOf:
        - $ref: "#/components/schemas/ParentProfileInput"
