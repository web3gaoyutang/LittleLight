          type: string
        content:
          type: string
        aiReply:
          type: string
    AIDraft:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ID"
        generationId:
          $ref: "#/components/schemas/ID"
        version:
          type: string
        tone:
          type: string
        style:
          type: string
        content:
          type: string
        safety:
          type: string
          enum: [teacher_review_required, self_care, crisis_support_required, student_safety_review_required, medical_review_required]
        provider:
          type: string
          description: llm / mock / safety_rules.
        source:
          type: string
          description: Model name, local_template, local_fallback, or risk_guardrail.
        fallback:
          type: boolean
          description: True when the service had to use a local fallback instead of the configured model.
        reviewRequired:
          type: boolean
          description: True when the draft should be manually reviewed before use.
        safetyNote:
          type: string
        safetyLevel:
          type: string
          enum: [info, review, high]
          description: Coarse safety severity used by clients to render review or high-risk states.
        safetyReason:
          type: string
          description: Human-readable reason explaining why the safety label or review requirement was applied.
        safetySignals:
          type: array
          description: Matched guardrail signals or keywords that triggered the safety classification.
          items:
            type: string
    AIActionInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [copy, save_record, save_healing, review_confirmed, review_skipped]
        draftId:
          type: string
        note:
          type: string
        metadata:
          type: object
          additionalProperties: true
    AIAction:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ID"
        generationId:
          $ref: "#/components/schemas/ID"
        action:
          type: string
          enum: [copy, save_record, save_healing, review_confirmed, review_skipped]
        draftId:
          type: string
        note:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AIGeneration:
