name: Engineering Checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install doc tooling
        run: python -m pip install pyyaml
      - name: Validate OpenAPI YAML
        run: python -c "import yaml; data=yaml.safe_load(open('docs/openapi.yaml', encoding='utf-8')); assert data['openapi'].startswith('3.'); assert '/api/v1/dashboard' in data['paths']; assert 'Course' in data['components']['schemas']; print('OpenAPI ok')"
      - name: Validate documentation coverage
        run: python scripts/verify-docs.py
      - name: Validate Docker Compose config
        run: docker compose -f deploy/docker-compose.yml config --quiet

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download Go modules
        working-directory: server
        run: go mod download
      - name: Test server
        working-directory: server
        run: go test ./...

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test API client
        working-directory: app
        run: npm run test:api
      - name: Build H5
        working-directory: app
        run: npm run build:h5

  integration:
    runs-on: ubuntu-latest
    needs: [docs, server, app]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: littlelight
          POSTGRES_PASSWORD: littlelight
          POSTGRES_DB: littlelight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U littlelight -d littlelight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start API
        working-directory: server
        env:
          APP_ENV: docker
          HTTP_ADDR: :8080
          DATABASE_URL: postgres://littlelight:littlelight@localhost:5432/littlelight?sslmode=disable
          REDIS_ADDR: localhost:6379
          REDIS_DB: 0
          MIGRATIONS_DIR: migrations
          AI_PROVIDER: mock
        run: |
          go run ./cmd/api > ../api-smoke.log 2>&1 &
          echo $! > ../api-smoke.pid
      - name: Run API smoke test
        run: node scripts/api-smoke.mjs
      - name: Show API logs on failure
        if: failure()
        run: cat api-smoke.log || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [docs, server, app, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/server.Dockerfile -t littlelight-api:ci .
      - name: Build Web image
        run: docker build -f deploy/web.Dockerfile -t littlelight-web:ci .
