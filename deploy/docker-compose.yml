services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.22-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.20}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      APP_ENV: ${APP_ENV:-docker}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://littlelight:littlelight@postgres:5432/littlelight?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      MIGRATIONS_DIR: /app/migrations
      SESSION_SECRET: ${SESSION_SECRET:-littlelight-docker-session-secret-32}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      AUTH_ALLOW_DEV_USER: ${AUTH_ALLOW_DEV_USER:-false}
      AUTH_ALLOW_MOCK_LOGIN: ${AUTH_ALLOW_MOCK_LOGIN:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: littlelight
      POSTGRES_PASSWORD: littlelight
      POSTGRES_DB: littlelight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlelight -d littlelight"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
