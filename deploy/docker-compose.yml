services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
    environment:
      APP_ENV: docker
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://littlelight:littlelight@postgres:5432/littlelight?sslmode=disable
      REDIS_ADDR: redis:6379
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: littlelight
      POSTGRES_PASSWORD: littlelight
      POSTGRES_DB: littlelight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlelight -d littlelight"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
